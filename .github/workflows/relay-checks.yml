name: Relay checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test relay and plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:release
      - run: npm run test:relay
      - name: Install Lua test runtime
        run: sudo apt-get update && sudo apt-get install -y luajit lua-dkjson
      - name: Test Lua plugin
        run: luajit tools/spec_runner.lua
      - name: Build the Unraid image without publishing
        run: docker build -t xray-relay:test .
      - name: Smoke test the non-root read-only container
        run: bash tools/smoke-relay-image.sh
