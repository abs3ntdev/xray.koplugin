name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize version allocation without replacing older pending runs.
# GitHub currently supports up to 100 pending runs with queue: max.
concurrency:
  group: release-main
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Publish Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release policy
        run: npm run test:release

      - name: Check semantic baseline
        run: |
          # Refuse semantic-release's default 1.0.0 if bootstrap was missed.
          test "$(git rev-parse 'v26.9.29^{commit}')" = 9fd6efb6e78ec32230694bc4d4759f76073ee130

      - name: Package committed plugin
        env:
          PUSH_SHA: ${{ github.sha }}
        run: python3 tools/package_release.py "$PUSH_SHA" xray.koplugin.zip

      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
