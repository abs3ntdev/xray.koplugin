name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize version allocation without replacing older pending runs.
# GitHub currently supports up to 100 pending runs with queue: max.
concurrency:
  group: release-main
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Publish Semantic Release
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.image-release.outputs.release_tag }}
      release_version: ${{ steps.image-release.outputs.release_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release policy
        run: npm run test:release

      - name: Test setup relay
        run: npm run test:relay

      - name: Install Lua test runtime
        run: sudo apt-get update && sudo apt-get install -y luajit lua-dkjson

      - name: Test Lua plugin
        run: luajit tools/spec_runner.lua

      - name: Build the Unraid image before releasing
        run: docker build -t xray-relay:test .

      - name: Smoke test the non-root read-only container
        run: bash tools/smoke-relay-image.sh

      - name: Check semantic baseline
        run: |
          # Refuse semantic-release's default 1.0.0 if bootstrap was missed.
          test "$(git rev-parse 'v26.9.29^{commit}')" = 9fd6efb6e78ec32230694bc4d4759f76073ee130

      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Select the exact published release for the image
        id: image-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/relay-release-metadata.mjs

  image:
    name: Publish Unraid relay image
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.build.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify image commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node for publication guard
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # A failed-job rerun reuses saved job outputs. Recheck here so an old
      # rerun can repair its version tags without moving latest backwards.
      - name: Recheck exact release and latest eligibility
        id: confirm-release
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/relay-release-metadata.mjs

      - name: Set up Docker Buildx
        if: steps.confirm-release.outputs.release_tag != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.confirm-release.outputs.release_tag != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish relay
        if: steps.confirm-release.outputs.release_tag != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.release_tag }}
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.release_version }}
            ${{ steps.confirm-release.outputs.publish_latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.release_version }}
            org.opencontainers.image.licenses=MIT
